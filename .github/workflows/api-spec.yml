name: API spec

on:
  push:
    paths: ['api/**', '.github/workflows/api-spec.yml']
  pull_request:
    paths: ['api/**', '.github/workflows/api-spec.yml']

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openapi-spec-validator
      - run: openapi-spec-validator api/openapi.yaml
